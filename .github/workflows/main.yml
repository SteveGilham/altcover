name: CI

on:
  push:
    branches:
    - master
    - feature/*
    - release/*
    - develop/github/*
  pull_request:
    branches:
    - master

permissions:
  contents: read

# per https://www.meziantou.net/how-to-cancel-github-workflows-when-pushing-new-commits-on-a-branch.htm
# https://docs.github.com/en/actions/learn-github-actions/expressions
# https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
concurrency:
  # github.workflow: name of the workflow
  # github.event.pull_request.number || github.ref: pull request number or branch name if not a pull request
  group: ${{ github.workflow }}
  #-${{ github.event.pull_request.number || github.ref }}

  # Cancel in-progress runs when a new workflow with the same group name is triggered
  cancel-in-progress: true

jobs:
  windows:
    permissions:
      id-token: write
      contents: read
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/*.fsproj
          **/packages.lock.json
          **/Directory.Packages.props
    - name: Tools
      run: dotnet tool restore
    - name: Setup
      run: dotnet run --project ./Build/Setup.fsproj

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

      ## Note: The NuGet/login action uses OIDC to get a temporary API key for NuGet.org, which is valid for 1 hour.
    - name: Store API token
      run: echo "NUGET_API_TOKEN=${{steps.login.outputs.NUGET_API_KEY}}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        NUGET_USER: ${{ secrets.NUGET_USER }}
      run: dotnet run --project ./Build/Build.fsproj
    - uses: actions/upload-artifact@v7
      with:
          name: nupkgs
          path: _Packagin*/*.nupkg
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
          name: reports.windows
          path: |
            _Reports
            _Packaging/*.xml
            ./**/AltCover*.log
            ./**/dotnettest.*.txt
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/*.fsproj
          **/packages.lock.json
          **/Directory.Packages.props
    - name: Install mono 
      run: sudo apt-get update && sudo apt-get install -y mono-devel
    - name: Tools
      run: dotnet tool restore
    - name: Setup
      run: dotnet run --project ./Build/Setup.fsproj
    - name: Build
      run: dotnet run --project ./Build/Build.fsproj
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
          name: reports.linux
          path: |
            _Reports
            _Packaging/*.xml
            ./**/AltCover*.log
            ./**/dotnettest.*.txt